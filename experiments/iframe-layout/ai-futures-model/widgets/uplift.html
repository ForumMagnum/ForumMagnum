<meta name="lw-layout" content="position=right width=46%">
<style>
  #chart { margin-top: 12px; }
</style>
<div class="fig">
  <div class="kicker">How far away is the Automated Coder?</div>
  <div class="slider"><div class="top"><span>AI coding uplift today</span><span class="val" id="u0v"></span></div>
    <input id="u0" type="range" min="1.25" max="4" step="0.05" value="2"></div>
  <div class="slider"><div class="top"><span>Months for the excess to double</span><span class="val" id="tv"></span></div>
    <input id="t" type="range" min="2" max="12" step="0.5" value="5"></div>
  <div class="slider"><div class="top"><span>Uplift that counts as AC</span><span class="val" id="uacv"></span></div>
    <input id="uac" type="range" min="5" max="50" step="1" value="20"></div>
  <div class="stats">
    <div class="stat"><div class="label">Trend hits AC in</div><div class="value" id="months"></div></div>
    <div class="stat"><div class="label">Around</div><div class="value" id="when"></div></div>
  </div>
  <svg id="chart" viewBox="0 0 320 168" role="img" aria-label="Coding uplift over time"></svg>
  <div class="caption">A straight extrapolation of the uplift trend from August 2026. The full model simulates the feedback loop instead, so its dates differ.</div>
</div>
<script>
const START = { year: 2026, month: 7 };
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const el = id => document.getElementById(id);

function paintSlider(input) {
  const pct = (input.value - input.min) / (input.max - input.min) * 100;
  input.style.setProperty('--pct', pct + '%');
}

function monthsToAC(u0, t, uac) {
  return t * Math.log2((uac - 1) / (u0 - 1));
}

function dateAfter(months) {
  const total = START.year * 12 + START.month + Math.round(months);
  return MONTH_NAMES[total % 12] + ' ' + Math.floor(total / 12);
}

function draw(u0, t, uac, m) {
  const L = 30, R = 312, T = 14, B = 140;
  const span = Math.max(36, Math.ceil((m + 10) / 12) * 12);
  const x = mo => L + (R - L) * mo / span;
  const y = u => B - (B - T) * Math.log10(u) / 2;
  let s = '';
  for (const u of [1, 2, 5, 10, 20, 50, 100]) {
    s += '<line class="gridline" x1="' + L + '" x2="' + R + '" y1="' + y(u) + '" y2="' + y(u) + '" stroke-dasharray="' + (u === 1 ? '' : '2 3') + '"/>';
    s += '<text class="axis-label" x="' + (L - 5) + '" y="' + (y(u) + 3.5) + '" text-anchor="end">' + u + '×</text>';
  }
  for (let year = START.year + 1; ; year++) {
    const mo = (year - START.year) * 12 - START.month;
    if (mo > span) break;
    s += '<text class="axis-label" x="' + x(mo) + '" y="' + (B + 16) + '" text-anchor="middle">' + year + '</text>';
  }
  const points = [];
  for (let mo = 0; mo <= span; mo += span / 160) {
    const u = 1 + (u0 - 1) * Math.pow(2, mo / t);
    if (u > 100) break;
    points.push([x(mo), y(u)]);
  }
  const line = points.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  s += '<line x1="' + L + '" x2="' + R + '" y1="' + y(uac) + '" y2="' + y(uac) + '" stroke="#a33a26" stroke-width="1.2" stroke-dasharray="4 3"/>';
  s += '<path d="' + line + '" fill="none" stroke="#2a623d" stroke-width="2.5" stroke-linecap="round"/>';
  s += '<circle cx="' + x(0) + '" cy="' + y(u0) + '" r="3.5" fill="#ffffff" stroke="#2a623d" stroke-width="2"/>';
  if (m <= span) {
    const ax = x(m), ay = y(uac), px = Math.min(Math.max(ax, L + 20), R - 20);
    s += '<circle cx="' + ax + '" cy="' + ay + '" r="4.5" fill="#2a623d" stroke="#ffffff" stroke-width="1.5"/>';
    s += '<rect x="' + (px - 17) + '" y="' + (ay - 30) + '" width="34" height="17" rx="8.5" fill="#2a623d"/>';
    s += '<text x="' + px + '" y="' + (ay - 18) + '" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">AC</text>';
  }
  el('chart').innerHTML = s;
}

function update() {
  for (const id of ['u0', 't', 'uac']) paintSlider(el(id));
  const u0 = +el('u0').value, t = +el('t').value, uac = +el('uac').value;
  el('u0v').textContent = u0.toFixed(2) + '×';
  el('tv').textContent = t + ' mo';
  el('uacv').textContent = uac + '×';
  const m = monthsToAC(u0, t, uac);
  el('months').textContent = Math.round(m) + ' mo';
  el('when').textContent = dateAfter(m);
  draw(u0, t, uac, m);
}

for (const id of ['u0', 't', 'uac']) el(id).addEventListener('input', update);
update();
</script>
