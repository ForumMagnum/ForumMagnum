# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Deploy LW / AF Prod
concurrency: deploy-lw-prod
on:
  push:
    branches: [ master ]
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SKIP_VERCEL_CODE_PULL: true
    steps:
    - uses: actions/checkout@v2
    - name: Pull Vercel Environment Information
      if: github.ref == 'refs/heads/master'
      run: |
        npm install --global vercel@latest
        vercel env pull --yes --environment=production --token=${{ secrets.VERCEL_ACCESS_TOKEN }}
    - name: Run Migrations
      if: github.ref == 'refs/heads/master'
      uses: ./.github/actions/runLWMigrations
      with:
        mode: prod
  upload-ckeditor-bundle:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SKIP_VERCEL_CODE_PULL: true
    steps:
    - uses: actions/checkout@v2
    - name: Pull Vercel Environment Information
      if: github.ref == 'refs/heads/master'
      run: |
        npm install --global vercel@latest
        vercel env pull --yes --environment=production --token=${{ secrets.VERCEL_ACCESS_TOKEN }}
    - name: Upload ckEditor bundle
      if: github.ref == 'refs/heads/master'
      uses: ./.github/actions/uploadLWCkEditorBundle
      with:
        mode: prod
  deploy-hocuspocus:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: hocuspocusserver
    defaults:
      run:
        working-directory: fly/hocuspocusServer
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: superfly/flyctl-actions/setup-flyctl@master
    # Images we deploy are labeled git-<sha>, so we can diff against whatever
    # is currently running rather than against the previous push (which misses
    # changes from runs that were superseded in the concurrency group).
    - name: Check whether hocuspocus changed since the deployed version
      id: check
      run: |
        set -euo pipefail
        deployed_tags=$(flyctl image show --app "$FLY_APP" --json | jq -r '[(. // [])[].Tag] | unique | .[]')
        echo "Deployed image tags: $deployed_tags"
        deployed_sha=""
        if [[ "$deployed_tags" =~ ^git-([0-9a-f]{40})$ ]]; then
          deployed_sha="${BASH_REMATCH[1]}"
        fi
        if [[ -z "$deployed_sha" ]]; then
          echo "Deployed version is not a single git-labeled image; deploying."
          echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
        elif ! git cat-file -e "${deployed_sha}^{commit}"; then
          echo "Deployed commit $deployed_sha is not in this repository's history; deploying."
          echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
        elif git diff --quiet "$deployed_sha" "$GITHUB_SHA" -- .; then
          echo "No changes to fly/hocuspocusServer since $deployed_sha; skipping deploy."
          echo "needs_deploy=false" >> "$GITHUB_OUTPUT"
        else
          echo "fly/hocuspocusServer changed since $deployed_sha; deploying."
          echo "needs_deploy=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Deploy hocuspocus to fly.io
      if: steps.check.outputs.needs_deploy == 'true'
      run: flyctl deploy --config fly.toml --app "$FLY_APP" --remote-only --image-label "git-${GITHUB_SHA}"
  deploy:
    runs-on: ubuntu-latest
    needs: [migrate, upload-ckeditor-bundle, deploy-hocuspocus]
    steps:
    - name: Deploy to LW Prod
      run: |
        curl -X POST ${{ secrets.VERCEL_LW_DEPLOY_HOOK_URL }}
        curl -X POST ${{ secrets.VERCEL_AF_DEPLOY_HOOK_URL }}
