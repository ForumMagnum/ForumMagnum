name: 'Setup Environment'
description: 'Setup the server environment for ForumMagnum'
inputs:
  node-version:
    description: 'Which version of NodeJS to use'
    required: false
    default: 24.15
runs:
  using: composite
  steps:
    - name: Use Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache node modules
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: forum-env-cache-${{ hashFiles('yarn.lock') }}

    - name: Cache hocuspocus server node modules
      id: cache-hocuspocus-server-node-modules
      uses: actions/cache@v4
      with:
        path: fly/hocuspocusServer/node_modules
        key: forum-hocuspocus-server-env-cache-${{ hashFiles('fly/hocuspocusServer/yarn.lock') }}

    - name: Cache Excalidraw build dependencies
      id: cache-excalidraw-node-modules
      uses: actions/cache@v4
      with:
        path: excalidraw/node_modules
        key: forum-excalidraw-env-cache-${{ hashFiles('excalidraw/yarn.lock') }}

    - name: Setup node-gyp
      shell: bash
      run: yarn global add node-gyp

    - name: Install dependencies
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --frozen-lockfile

    - name: Install hocuspocus server dependencies
      if: steps.cache-hocuspocus-server-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --frozen-lockfile --cwd fly/hocuspocusServer

    - name: Install Excalidraw build dependencies
      if: steps.cache-excalidraw-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: yarn install --frozen-lockfile --cwd excalidraw

    # The build output of the vendored Excalidraw isn't committed. It's built by
    # scripts/postinstall.sh, which doesn't run if node_modules was restored
    # from the cache. (This is a no-op if postinstall already built it.)
    - name: Build Excalidraw
      shell: bash
      run: yarn --cwd excalidraw build

    - name: Verify dependencies were installed
      shell: bash
      run: test -d node_modules

    - name: Generate Next.js route types
      shell: bash
      run: yarn next typegen .
